name: Actualizar feeds oficiales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-feeds.yml'
  schedule:
    # Franja para horario de verano e invierno; se valida en Europe/Madrid.
    # Minutos no redondos para evitar la concentración de cron de GitHub.
    - cron: '17 6,7,18,19 * * *'
permissions:
  contents: write
concurrency:
  group: feeds-cibersec
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar horario Europe/Madrid
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HORA=$(TZ=Europe/Madrid date +%H)
          if [ "$EVENT_NAME" != "schedule" ] || [ "$HORA" = "08" ] || [ "$HORA" = "20" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Ejecución candidata fuera de horario: $HORA"
          fi
      - uses: actions/setup-python@v5
        if: steps.window.outputs.should_run == 'true'
        with:
          python-version: '3.12'
      - name: Recopilar feeds oficiales
        if: steps.window.outputs.should_run == 'true'
        run: python scripts/update_source_feeds.py
      - name: Actualizar catálogo de security advisories
        if: steps.window.outputs.should_run == 'true'
        env:
          GH_ADVISORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_advisories.py
      - name: Revisar fuentes de incidentes pendientes (máximo 10)
        if: steps.window.outputs.should_run == 'true'
        run: python scripts/review_existing_incidents.py
      - name: Publicar datos si hay cambios
        if: steps.window.outputs.should_run == 'true'
        run: |
          if ! git diff --quiet -- source-alerts.json incident-review-state.json advisories.json || [ -n "$(git ls-files --others --exclude-standard source-alerts.json incident-review-state.json advisories.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source-alerts.json incident-review-state.json advisories.json
            git commit -m "chore: actualizar feeds y seguimiento de incidentes"
            git push
          fi
