name: Actualizar feeds oficiales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-feeds.yml'
  schedule:
    # Cuatro revisiones diarias, con minuto 23 para reducir retrasos.
    # Se ejecuta en UTC y los resultados se muestran en Europe/Madrid.
    - cron: '23 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: feeds-cibersec
  cancel-in-progress: false
jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recopilar feeds oficiales
        run: python scripts/update_source_feeds.py
      - name: Actualizar catálogo de security advisories
        env:
          GH_ADVISORY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_advisories.py
      - name: Generar candidatos de incidentes para revisión
        run: python scripts/build_incident_candidates.py
      - name: Revisar fuentes de incidentes pendientes (máximo 10)
        run: python scripts/review_existing_incidents.py
      - name: Validar coherencia de los archivos generados
        run: python scripts/validate_data.py
      - name: Publicar datos si hay cambios
        run: |
          if ! git diff --quiet -- source-alerts.json incident-review-state.json advisories.json incident-candidates.json || [ -n "$(git ls-files --others --exclude-standard source-alerts.json incident-review-state.json advisories.json incident-candidates.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source-alerts.json incident-review-state.json advisories.json incident-candidates.json
            git commit -m "chore: actualizar feeds y seguimiento de incidentes"
            # Evitar fallos cuando main avanza mientras se consultan las fuentes.
            # Solo este commit contiene los JSON generados; no reescribimos historial.
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Datos publicados correctamente (intento $attempt)."
                exit 0
              fi
              echo "main ha avanzado: integrando cambios remotos (intento $attempt)."
              git fetch origin main
              # Durante rebase, 'theirs' es el commit local generado.
              # Así conservamos los JSON recién calculados si existe conflicto.
              if ! git rebase -X theirs origin/main; then
                git rebase --abort || true
                echo "::error::Conflicto no resuelto al integrar main."
                exit 1
              fi
              sleep 2
            done
            echo "::error::No se pudieron publicar los datos después de cuatro intentos."
            exit 1
          fi
